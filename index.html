<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Glass Calculator</title>

  <style>
    :root {
      --page-bg: #eef2ff;
      --page-bg-secondary: #f8fafc;
      --orb-one: #a78bfa;
      --orb-two: #67e8f9;

      --glass: rgba(255, 255, 255, 0.58);
      --glass-border: rgba(255, 255, 255, 0.72);
      --glass-highlight: rgba(255, 255, 255, 0.38);

      --display-bg: rgba(255, 255, 255, 0.24);
      --display-text: #0f172a;
      --secondary-text: #64748b;

      --key-bg: rgba(255, 255, 255, 0.5);
      --key-hover: rgba(255, 255, 255, 0.72);
      --key-text: #0f172a;

      --operator-bg: linear-gradient(145deg, #8b5cf6, #6366f1);
      --equals-bg: linear-gradient(145deg, #10b981, #059669);
      --danger-bg: linear-gradient(145deg, #fb7185, #ef4444);

      --shadow: rgba(15, 23, 42, 0.2);
      --danger-red: #ef4444;
    }

    body.dark {
      --page-bg: #090d1a;
      --page-bg-secondary: #111827;
      --orb-one: #7c3aed;
      --orb-two: #0891b2;

      --glass: rgba(15, 23, 42, 0.6);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-highlight: rgba(255, 255, 255, 0.08);

      --display-bg: rgba(255, 255, 255, 0.07);
      --display-text: #f8fafc;
      --secondary-text: #94a3b8;

      --key-bg: rgba(255, 255, 255, 0.08);
      --key-hover: rgba(255, 255, 255, 0.15);
      --key-text: #f8fafc;

      --shadow: rgba(0, 0, 0, 0.48);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px;
      color: var(--display-text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, var(--orb-one), transparent 30%),
        radial-gradient(circle at 85% 85%, var(--orb-two), transparent 30%),
        linear-gradient(135deg, var(--page-bg), var(--page-bg-secondary));
      transition: background 0.4s ease;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      pointer-events: none;
    }

    body::before {
      top: 5%;
      left: -80px;
      background: var(--orb-one);
    }

    body::after {
      right: -80px;
      bottom: 5%;
      background: var(--orb-two);
    }

    .calculator {
      width: min(100%, 410px);
      padding: clamp(18px, 5vw, 28px);
      border: 1px solid var(--glass-border);
      border-radius: 36px;
      background: var(--glass);
      box-shadow:
        0 30px 80px var(--shadow),
        inset 0 1px 1px var(--glass-highlight);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--secondary-text);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #22d3ee);
      box-shadow: 0 0 14px #8b5cf6;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      min-width: 48px;
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      color: var(--key-text);
      background: var(--key-bg);
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--key-hover);
      transform: translateY(-2px);
    }

    .profile-area {
      position: relative;
    }

    .profile-button {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px 5px 5px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      color: var(--key-text);
      background: var(--key-bg);
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .profile-button:hover {
      background: var(--key-hover);
      transform: translateY(-1px);
    }

    .avatar,
    .large-avatar {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      font-weight: 800;
    }

    .avatar {
      width: 32px;
      height: 32px;
      font-size: 0.8rem;
    }

    .large-avatar {
      width: 46px;
      height: 46px;
      font-size: 1.1rem;
    }

    .profile-name {
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .profile-chevron {
      font-size: 1rem;
      opacity: 0.7;
    }

    .profile-menu {
      position: absolute;
      z-index: 20;
      top: calc(100% + 12px);
      right: 0;
      width: min(260px, 72vw);
      padding: 14px;
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      background: var(--glass);
      box-shadow: 0 20px 40px var(--shadow);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
    }

    .profile-header strong,
    .profile-header small {
      display: block;
    }

    .profile-header small {
      max-width: 155px;
      margin-top: 3px;
      overflow: hidden;
      color: var(--secondary-text);
      font-size: 0.75rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-role {
      margin: 12px 0;
      padding: 8px 10px;
      border-radius: 10px;
      color: var(--secondary-text);
      background: var(--display-bg);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .developer-options {
      margin: 10px 0;
      padding-top: 10px;
      border-top: 1px solid var(--glass-border);
    }

    .menu-label {
      margin-bottom: 6px;
      color: #8b5cf6;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .profile-menu button {
      width: 100%;
      min-height: 42px;
      margin-top: 6px;
      padding: 8px 10px;
      border: none;
      border-radius: 12px;
      color: var(--key-text);
      background: transparent;
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .profile-menu button:hover {
      background: var(--key-hover);
    }

    .logout-button {
      border-top: 1px solid var(--glass-border) !important;
      border-radius: 0 !important;
      color: var(--danger-red) !important;
      margin-top: 12px !important;
    }

    .display-container {
      min-height: 132px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 8px;
      padding: 22px 20px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      background: var(--display-bg);
      box-shadow: inset 0 1px 1px var(--glass-highlight);
    }

    .expression {
      width: 100%;
      overflow: hidden;
      color: var(--secondary-text);
      font-size: clamp(0.95rem, 3vw, 1.1rem);
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display {
      width: 100%;
      overflow: hidden;
      color: var(--display-text);
      font-size: clamp(2.4rem, 11vw, 4rem);
      font-weight: 300;
      letter-spacing: -0.06em;
      line-height: 1;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(9px, 2.8vw, 14px);
      margin-top: 18px;
    }

    button {
      min-width: 0;
      min-height: clamp(64px, 16vw, 78px);
      border: 1px solid transparent;
      border-radius: 24px;
      color: var(--key-text);
      background: var(--key-bg);
      box-shadow:
        0 8px 16px rgba(15, 23, 42, 0.08),
        inset 0 1px 1px var(--glass-highlight);
      font: inherit;
      font-size: clamp(1.2rem, 5vw, 1.45rem);
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition:
        transform 0.12s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    button:hover {
      background: var(--key-hover);
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.94);
      box-shadow: inset 0 3px 8px rgba(15, 23, 42, 0.12);
    }

    button:focus-visible {
      outline: 3px solid rgba(99, 102, 241, 0.55);
      outline-offset: 3px;
    }

    .operator,
    .equals,
    .danger {
      color: white;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .operator {
      background: var(--operator-bg);
    }

    .equals {
      grid-column: span 2;
      background: var(--equals-bg);
    }

    .danger {
      background: var(--danger-bg);
    }

    .zero {
      grid-column: span 2;
    }

    @media (max-width: 430px) {
      body {
        padding: 12px;
        align-items: end;
      }

      .calculator {
        border-radius: 32px;
        padding: 18px;
      }

      .display-container {
        min-height: 124px;
      }

      button {
        border-radius: 21px;
      }
    }

    @media (max-height: 700px) and (orientation: landscape) {
      body {
        padding: 12px;
      }

      .calculator {
        max-width: 620px;
      }

      .display-container {
        min-height: 90px;
      }

      button {
        min-height: 52px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="calculator" aria-label="Calculator">
    <div class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        Glass Calc
      </div>

      <div class="topbar-actions">
        <button
          class="theme-toggle"
          id="themeToggle"
          type="button"
          aria-label="Switch theme"
        >
          🌙
        </button>

        <div class="profile-area">
          <button
            class="profile-button"
            id="profileButton"
            type="button"
            aria-label="Open profile"
            aria-expanded="false"
          >
            <span class="avatar" id="avatar">U</span>
            <span class="profile-name" id="profileName">User</span>
            <span class="profile-chevron">⌄</span>
          </button>

          <div class="profile-menu" id="profileMenu" hidden>
            <div class="profile-header">
              <span class="large-avatar" id="largeAvatar">U</span>
              <div>
                <strong id="menuName">User</strong>
                <small id="menuEmail">user@example.com</small>
              </div>
            </div>

            <div class="profile-role" id="profileRole">Standard User</div>

            <div class="developer-options" id="developerOptions" hidden>
              <div class="menu-label">Developer tools</div>
              <button type="button" data-dev-action="inspect">🔍 Inspect calculator</button>
              <button type="button" data-dev-action="debug">🐞 Debug mode</button>
            </div>

            <button class="logout-button" id="logoutButton" type="button">
              Log out
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="display-container" aria-live="polite">
      <div class="expression" id="expression"></div>
      <div class="display" id="display">0</div>
    </section>

    <section class="buttons">
      <button class="danger" data-action="clear" type="button">AC</button>
      <button data-action="delete" type="button">⌫</button>
      <button class="operator" data-value="%" type="button">%</button>
      <button class="operator" data-value="÷" type="button">÷</button>

      <button data-value="7" type="button">7</button>
      <button data-value="8" type="button">8</button>
      <button data-value="9" type="button">9</button>
      <button class="operator" data-value="×" type="button">×</button>

      <button data-value="4" type="button">4</button>
      <button data-value="5" type="button">5</button>
      <button data-value="6" type="button">6</button>
      <button class="operator" data-value="−" type="button">−</button>

      <button data-value="1" type="button">1</button>
      <button data-value="2" type="button">2</button>
      <button data-value="3" type="button">3</button>
      <button class="operator" data-value="+" type="button">+</button>

      <button class="zero" data-value="0" type="button">0</button>
      <button data-value="." type="button">.</button>
      <button class="equals" data-action="calculate" type="button">=</button>
    </section>
  </main>

  <script>
    const display = document.getElementById("display");
    const expression = document.getElementById("expression");
    const buttons = document.querySelector(".buttons");
    const themeToggle = document.getElementById("themeToggle");

    let currentValue = "";
    let previousExpression = "";

    function updateDisplay() {
      display.textContent = currentValue || "0";
      expression.textContent = previousExpression;
    }

    function appendValue(value) {
      if (currentValue === "Error") {
        currentValue = "";
      }

      if (value === ".") {
        const lastNumber = currentValue.split(/[+−×÷%]/).pop();
        if (lastNumber.includes(".")) return;
        if (!lastNumber) value = "0.";
      }

      if (["+", "−", "×", "÷", "%"].includes(value)) {
        if (!currentValue && value !== "−") return;
        if (["+", "−", "×", "÷"].includes(currentValue.slice(-1))) {
          currentValue = currentValue.slice(0, -1);
        }
      }

      currentValue += value;
      updateDisplay();
    }

    function clearCalculator() {
      currentValue = "";
      previousExpression = "";
      updateDisplay();
    }

    function deleteLast() {
      currentValue = currentValue.slice(0, -1);
      updateDisplay();
    }

    function calculateResult() {
      if (!currentValue) return;

      try {
        const safeExpression = currentValue
          .replace(/×/g, "*")
          .replace(/÷/g, "/")
          .replace(/−/g, "-")
          .replace(/%/g, "/100");

        if (!/^[0-9+\-*/.() ]+$/.test(safeExpression)) {
          throw new Error("Invalid expression");
        }

        const result = Function(`"use strict"; return (${safeExpression})`)();

        if (!Number.isFinite(result)) {
          throw new Error("Invalid result");
        }

        previousExpression = `${currentValue} =`;
        currentValue = String(Number(result.toFixed(10)));
        updateDisplay();
      } catch {
        previousExpression = "";
        currentValue = "Error";
        updateDisplay();
      }
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      themeToggle.textContent = isDark ? "☀️" : "🌙";
      themeToggle.setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
      localStorage.setItem("calculator-theme", isDark ? "dark" : "light");
    }

    function loadTheme() {
      const savedTheme = localStorage.getItem("calculator-theme");

      if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.body.classList.add("dark");
        themeToggle.textContent = "☀️";
        themeToggle.setAttribute("aria-label", "Switch to light theme");
      }
    }

    buttons.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const { action, value } = button.dataset;

      if (action === "clear") clearCalculator();
      else if (action === "delete") deleteLast();
      else if (action === "calculate") calculateResult();
      else if (value) appendValue(value);
    });

    themeToggle.addEventListener("click", toggleTheme);

    document.addEventListener("keydown", (event) => {
      const keyMap = {
        "*": "×",
        "/": "÷",
        "-": "−",
        Enter: "calculate",
        "=": "calculate",
        Backspace: "delete",
        Escape: "clear"
      };

      const mappedKey = keyMap[event.key] || event.key;

      if (mappedKey === "calculate") {
        event.preventDefault();
        calculateResult();
      } else if (mappedKey === "delete") {
        deleteLast();
      } else if (mappedKey === "clear") {
        clearCalculator();
      } else if (/^[0-9.+−×÷%]$/.test(mappedKey)) {
        appendValue(mappedKey);
      }
    });

    // Demo auth/user logic:
    const currentUser = {
      name: "Alex User",
      email: "alex@example.com",
      role: "developer" // change to "user" to hide developer tools
    };

    const profileButton = document.getElementById("profileButton");
    const profileMenu = document.getElementById("profileMenu");
    const profileName = document.getElementById("profileName");
    const menuName = document.getElementById("menuName");
    const menuEmail = document.getElementById("menuEmail");
    const profileRole = document.getElementById("profileRole");
    const avatar = document.getElementById("avatar");
    const largeAvatar = document.getElementById("largeAvatar");
    const developerOptions = document.getElementById("developerOptions");
    const logoutButton = document.getElementById("logoutButton");

    function getInitials(name) {
      return name
        .split(" ")
        .map((part) => part[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();
    }

    function loadUserProfile() {
      const initials = getInitials(currentUser.name);
      const isDeveloper = currentUser.role === "developer";

      profileName.textContent = currentUser.name;
      menuName.textContent = currentUser.name;
      menuEmail.textContent = currentUser.email;

      avatar.textContent = initials;
      largeAvatar.textContent = initials;

      profileRole.textContent = isDeveloper ? "Developer account" : "Standard user";
      developerOptions.hidden = !isDeveloper;
    }

    function toggleProfileMenu() {
      const isOpen = !profileMenu.hidden;
      profileMenu.hidden = isOpen;
      profileButton.setAttribute("aria-expanded", String(!isOpen));
    }

    profileButton.addEventListener("click", (event) => {
      event.stopPropagation();
      toggleProfileMenu();
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".profile-area")) {
        profileMenu.hidden = true;
        profileButton.setAttribute("aria-expanded", "false");
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        profileMenu.hidden = true;
        profileButton.setAttribute("aria-expanded", "false");
      }
    });

    document.querySelectorAl
